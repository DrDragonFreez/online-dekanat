study_certificate:
  title: "Справка об обучении"
  anchors:
    - "СПРАВКА\\s+ОБ\\s+ОБУЧЕНИИ"
    - "Сведения\\s+об\\s+обучении\\s+студента"
  fields_order:
    - student_name
    - university
    - program
    - study_form
    - study_start
    - study_end
    - document_number
    - issue_date
    - signature_present
    - seal_present
  text_fields:
    - student_name
    - university
    - program
    - study_form
    - study_start
    - study_end
    - document_number
    - issue_date
  date_fields:
    - study_start
    - study_end
    - issue_date
  labels:
    student_name: "ФИО студента"
    university: "Название вуза"
    program: "Направление подготовки"
    study_form: "Форма обучения"
    study_start: "Начало периода обучения"
    study_end: "Окончание периода обучения"
    document_number: "Номер справки"
    issue_date: "Дата выдачи"
  required:
    rule:3.1:
      fields:
        - student_name
        - university
        - program
        - study_form
        - study_start
        - study_end
        - document_number
        - issue_date
    rule:3.2:
      flag: signature_present
    rule:3.3:
      flag: seal_present

